<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILES | Streetwear</title>
    <style>
        /* Estilos Base - Estética Streetwear */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            overflow-x: hidden;
            letter-spacing: 1px;
        }

        /* Navegación */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #eaeaea;
            background-color: #ffffff;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: #000000;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #888888;
        }

        /* Hero Section - Logo 3D */
        .hero {
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            padding: 20px;
        }

        .hero-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 450px;
            width: 100%;
        }

        @keyframes spin3D {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .logo-3d-rotate {
            width: 280px;
            height: auto;
            display: block;
            animation: spin3D 8s linear infinite;
        }

        .logo-3d-rotate:hover {
            animation-duration: 4s;
            cursor: pointer;
        }

        /* Sección de Productos */
        .products {
            padding: 60px 40px;
            display: flex;
            justify-content: center;
        }

        /* Cuadro flotante de la gorra */
        .card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 300px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        /* Títulos de la gorra */
        .brand-name {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 15px 0 2px;
            color: #111;
            text-transform: uppercase;
        }

        .product-subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            font-style: italic;
        }

        .click-hint {
            font-size: 11px;
            color: #999;
            margin: 5px 0;
        }

        /* Información oculta que aparece al hacer clic */
        .product-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease;
            opacity: 0;
        }

        .card.active .product-details {
            max-height: 150px;
            opacity: 1;
            margin-top: 10px;
        }

        .size {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Botón de compra */
        .btn-buy {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: #1ebe5d;
        }

        /* Footer */
        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid #eaeaea;
            color: #444444;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Navegación -->
    <nav>
        <div class="logo">MILES</div>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Colección</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <!-- Pantalla Principal con Logo Girando -->
    <section class="hero">
        <div class="hero-logo-container">
            <div style="perspective: 1000px; display: inline-block;">
                <img src="logo-ms-negro.png" alt="Logo MILESS" class="logo-3d-rotate">
            </div>
        </div>
    </section>

    <!-- Sección de Productos (Gorra) -->
    <section class="products">
        <div class="card" onclick="this.classList.toggle('active')">
            <img src="gorra-negra-miles.png" alt="Gorra MILESS Negra">
            
            <div class="brand-name">MILESS</div>
            <div class="product-subtitle">the kings of the city</div>
            <div class="click-hint">Haz clic para ver detalles</div>
            
            <div class="product-details" onclick="event.stopPropagation()">
                <div class="size">Talla: T/U (Talla Única)</div>
                <a href="https://wa.me/51949776995?text=Hola,%20estoy%20interesado%20en%20comprar%20la%20gorra%20MILESS%20negra" target="_blank" class="btn-buy">Comprar</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        &copy; 2026 MILES. Todos los derechos reservados.
    </footer>

</body>
</html>
